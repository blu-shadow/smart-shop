<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DadaXWear | Amar Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="profile.css">
    <style>
        .history-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 107, 0, 0.12);
            color: #ff6b00;
            border: 1px solid rgba(255, 107, 0, 0.3);
            border-radius: 20px;
            padding: 7px 15px;
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: background 0.2s;
        }
        .history-action-btn:active { background: rgba(255, 107, 0, 0.25); }
	.game-btn{
 	   display:inline-flex;
   	 align-items:center;
    gap:10px;
    padding:12px 20px;
    font-size:15px;
    font-weight:600;
    color:#fff;
    text-decoration:none;

    background:linear-gradient(135deg,#00c853,#00e676);
    border-radius:10px;

    transition:0.3s;
    box-shadow:0 4px 12px rgba(0,200,83,0.3);
}

.game-btn i{
    font-size:16px;
}

.game-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,200,83,0.5);
}   
    </style>
</head>
<body class="dark-theme">

    <div class="profile-dashboard">
        <!-- Top Action Bar -->
        <div class="profile-top-bar">
            <a href="help.html" class="help-action-btn">Help Me</a>
            <a href="history.html" class="history-action-btn">
                <i class="fas fa-box"></i> My Orders
            </a>
            <a href="setting.html" class="settings-action-btn">
                <i class="fas fa-cog"></i>
            </a>
        </div>

        <!-- Main Profile Info -->
        <div class="profile-main-card">
            <div class="profile-avatar">
                <img id="display-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User">
            </div>
            <h2 id="display-name">Loading...</h2>
            <p id="display-username">@username</p>
        </div>

        <!-- Detailed Info List -->
        <div class="info-container">
            <div class="info-row">
                <div class="info-label"><i class="fas fa-envelope"></i> Email</div>
                <div class="info-value" id="display-email">-</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-phone"></i> Phone</div>
                <div class="info-value" id="display-phone">-</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-calendar-alt"></i> Birth Year</div>
                <div class="info-value" id="display-birth">-</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-user-clock"></i> Age</div>
                <div class="info-value" id="display-age">-</div>
            </div>
            <div class="info-row">
                <div class="info-label"><i class="fas fa-map-marker-alt"></i> Address</div>
                <div class="info-value" id="display-address">-</div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="profile-footer-actions">
            <button class="edit-profile-btn" id="editBtn">
                <i class="fas fa-user-edit"></i> EDIT PROFILE
            </button>
            <button class="sign-out-btn" id="signOutBtn">
                <i class="fas fa-sign-out-alt"></i> SIGN OUT
            </button>
	    <a href="game.html" class="game-btn">
   	    <i class="fas fa-gamepad"></i> Play Game</a>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i></a>
        <a href="index.html"><i class="fas fa-shopping-bag"></i></a>
        <a href="profile.html" class="active"><i class="fas fa-user"></i></a>
    </nav>

    <!-- Internal Script -->
    <script>
        const API_BASE = 'https://dadaxwear.com/api';
        const SITE_DOMAIN = 'https://dadaxwear.com';

        document.addEventListener('DOMContentLoaded', async () => {
            const userPhone = localStorage.getItem('user_phone');

            if (!userPhone) {
                window.location.href = 'login.html';
                return;
            }

            // প্রোফাইল ডাটা লোড করা
            try {
                const res = await fetch(`${API_BASE}/user/get-profile/${userPhone}`);
                const data = await res.json();

                if (data.exists) {
                    updateProfileUI(data.user);
                } else {
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error("Profile Load Error:", err);
            }

            // সাইন আউট লজিক
            document.getElementById('signOutBtn').onclick = () => {
                localStorage.removeItem('user_phone');
                localStorage.removeItem('dxw_user');
                localStorage.removeItem('user_img'); // ইমেজও রিমুভ হবে
                window.location.href = 'login.html';
            };

            // এডিট বাটন লজিক
            document.getElementById('editBtn').onclick = () => {
                window.location.href = 'login.html';
            };
        });

        function updateProfileUI(user) {
            document.getElementById('display-name').innerText = user.name || 'User';
            document.getElementById('display-username').innerText = `@${user.username || 'username'}`;
            document.getElementById('display-email').innerText = user.email || '-';
            document.getElementById('display-phone').innerText = user.phone || '-';
            document.getElementById('display-birth').innerText = user.birthYear || '-';
            document.getElementById('display-age').innerText = user.age || '-';
            document.getElementById('display-address').innerText = user.address || '-';

            if (user.profileImage) {
                // ইমেজ URL তৈরি (IP সরিয়ে ডোমেইন ব্যবহার)
                const imgUrl = user.profileImage.startsWith('http') 
                    ? user.profileImage 
                    : `${SITE_DOMAIN}${user.profileImage}`;
                
                document.getElementById('display-img').src = imgUrl;

                // গুরুত্বপূর্ণ: মেইন পেজে দেখানোর জন্য ইমেজ URL লোকাল স্টোরেজে রাখা
                localStorage.setItem('user_img', imgUrl);
            }
        }
    </script>
</body>
</html>
